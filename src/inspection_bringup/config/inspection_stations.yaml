# Inspection station waypoints configuration
# Each station defines: AGV target pose, arm preset joints, depth adjustment params
stations:
  - name: "station_1"
    agv_pose:
      x: 1.0
      y: 2.0
      z: 0.0
      yaw: 0.5
    arm_joints: [0.0, -0.5, 1.2, 0.0, 0.8, 0.0]
    target_distance: 0.30
    distance_tolerance: 0.02
    adjust_axis: "z"

  - name: "station_2"
    agv_pose:
      x: 3.0
      y: 1.0
      z: 0.0
      yaw: -0.5
    arm_joints: [0.1, -0.3, 1.0, 0.2, 0.6, 0.0]
    target_distance: 0.25
    distance_tolerance: 0.02
    adjust_axis: "z"
